apiVersion: apps/v1
kind: Deployment

metadata:
  name: minio
  namespace: backup-system

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio

    spec:
      containers:
        - name: minio

          image: backup-lab-minio:2025-10-15
          imagePullPolicy: Never

          args:
            - server
            - /data
            - --console-address
            - ":9001"

          ports:
            - name: api
              containerPort: 9000

            - name: console
              containerPort: 9001

          envFrom:
            - secretRef:
                name: minio-credentials

          volumeMounts:
            - name: minio-storage
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20

      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-data